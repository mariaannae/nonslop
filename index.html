<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
        <!-- Open Graph Meta Tags -->
        <meta property="og:title" content="NON-SLOP Winner Badge" />
        <meta property="og:description" content="I just won! 🏆 Play this game and earn your badge!" />
        <meta property="og:image" content="thumbnail.png" />
        <meta property="og:url" content="https://mariaannae.github.io/nonslop" />
        <meta property="og:type" content="website" />
        <!-- Twitter Card Meta Tags -->
        <meta name="twitter:card" content="summary_large_image" />
        <meta name="twitter:title" content="NON-SLOP Winner Badge" />
        <meta name="twitter:description" content="I just won! 🏆 Play this game and earn your badge!" />
        <meta name="twitter:image" content="thumbnail.png" />
        <title>NON-SLOP</title>
        <style>
     
            
            /* Reset CSS: Please avoid making changes here unless you know what you're doing :) */
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }

            html, body {
                width: 100vw;
                height: 100vh;
                min-height: 100vh;
                margin: 0;
                padding: 0;
            }

            #game-container {
                width: 100vw;
                height: 100vh;
                min-height: 100vh;
                display: flex;
                align-items: center;
                justify-content: center;
                overflow: hidden;
                position: fixed;
                top: 0; left: 0; right: 0; bottom: 0;
                background: #13091e;
            }

            canvas {
                max-width: 100vw;
                max-height: 100vh;
                margin: auto;
                display: block;
                position: static !important;
                left: 0 !important;
                top: 0 !important;
                right: 0 !important;
                bottom: 0 !important;
            }
    
            body {
                line-height: 1;
                font-family: 'barcade3d', Arial, sans-serif;
                background-color: #13091e;
            }
    
            ol, ul {
                list-style: none;
            }
    
            img, video {
                max-width: 100%;
                height: auto;
                display: block;
            }
    
            a {
                text-decoration: none;
                color: inherit;
            }
            
            /* Fix cursor styling */
            #game-container, canvas {
                cursor: default !important;
            }
            
        </style>
    </head>
    <body>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/webfont/1.6.28/webfontloader.js"></script>
        
        <div id="game-container"></div>
        <script src="./phaser.js"></script>
        <script src="https://cdn.jsdelivr.net/npm/phaser3-rex-plugins/dist/rexbbcodetextplugin.min.js"></script>
        <script type="module" src="./src/main.js"></script>
    </body>
    </html>
